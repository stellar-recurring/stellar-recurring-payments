name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run without uploading to npm"
        required: false
        type: boolean
        default: false
      dist_tag:
        description: "npm distribution tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
      expected_version:
        description: "Optional version guard (must match packages/sdk/package.json version if provided)"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish-sdk:
    name: Build, test & publish @recurring-subscriptions/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js & npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Validate package metadata & inputs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.name !== "@recurring-subscriptions/sdk") {
              throw new Error(`Unexpected package name: ${pkg.name}`);
            }
            const allowedTags = new Set(["latest", "next", "beta"]);
            const tag = (process.env.DIST_TAG || "").trim();
            if (!allowedTags.has(tag)) {
              throw new Error(`Invalid dist_tag: ${tag}`);
            }
            const expected = (process.env.EXPECTED_VERSION || "").trim();
            if (expected && pkg.version !== expected) {
              throw new Error(`Version mismatch: package.json has ${pkg.version}, expected ${expected}`);
            }
            console.log(`Validated ${pkg.name}@${pkg.version} (tag=${tag})`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SDK
        run: npm run typecheck

      - name: Build SDK
        run: npm run build

      - name: Run SDK unit tests
        run: npm test

      - name: Inspect package tarball
        run: npm pack --dry-run

      - name: Publish @recurring-subscriptions/sdk to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running dry-run npm publish for @recurring-subscriptions/sdk (tag=$DIST_TAG)..."
            npm publish --access public --tag "$DIST_TAG" --dry-run
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret. Configure an npm granular automation token in repository secrets or run with dry_run=true."
            exit 1
          fi

          npm publish --access public --provenance --tag "$DIST_TAG"
