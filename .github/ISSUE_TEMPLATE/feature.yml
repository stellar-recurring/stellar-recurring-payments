name: Feature request
description: Propose a scoped enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contract
        - sdk
        - keeper
        - docs
        - ci
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: Optional list of what this should not include.
