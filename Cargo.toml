[workspace]
resolver = "2"
members = ["contracts/subscription_vault"]

[workspace.dependencies]
soroban-sdk = "=27.0.0"

# Host allows ed25519-dalek >=2; cargo would pick 3.x which breaks rand_chacha 0.3.
# Keep this pin when regenerating the lockfile (`cargo update -p ed25519-dalek --precise 2.2.0`).
[workspace.metadata.pins]
ed25519-dalek = "2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
